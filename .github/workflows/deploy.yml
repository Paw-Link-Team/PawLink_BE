name: BE Deploy to EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feat/#2" ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/paw-link-team/pawlink_be:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/paw-link-team/pawlink_be:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            export GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
            export DB_URL=${{ secrets.DB_URL }}
            export DB_USER_NAME=${{ secrets.DB_USER_NAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export ACCESS_TOKEN_VALIDITY_IN_MILLISECONDS=${{ secrets.ACCESS_TOKEN_VALIDITY_IN_MILLISECONDS }}
            export REFRESH_TOKEN_VALIDITY_IN_MILLISECONDS=${{ secrets.REFRESH_TOKEN_VALIDITY_IN_MILLISECONDS }}
            export KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            export KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            export KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            export NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            export NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            export NAVER_REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}
            
            chmod +x /home/ubuntu/app/deploy.sh
            /home/ubuntu/app/deploy.sh
